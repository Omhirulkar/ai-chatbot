<div class="chatbot-preview" [ngStyle]="{'border-color': themeColor}">
  <div class="bot-header" [ngStyle]="{'background-color': themeColor}">
    <div class="bot-info">
      <div class="status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">Online</span>
      </div>
      <div class="bot-details">
        <img [src]="botAvatar" alt="Bot Avatar" class="bot-avatar">
        <div class="bot-name-container">
          <span class="bot-name">{{ botName }}</span>
          <span class="bot-subtitle">Virtual Assistant</span>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <button class="action-btn">
        <i class="bi bi-three-dots-vertical"></i>
      </button>
      <button class="action-btn">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>
  
  <div class="chat-window">
    <div class="message-container">
      <div class="bot-message">
        <div class="message-avatar">
          <img [src]="botAvatar" alt="Bot Avatar">
        </div>
        <div class="message-bubble" [ngStyle]="{'background-color': themeColor}">
          <p>{{ welcomeMessage }}</p>
          <div class="message-time">Just now</div>
        </div>
      </div>
      
      <div class="typing-indicator" *ngIf="isTyping">
        <div class="message-avatar">
          <img [src]="botAvatar" alt="Bot Avatar">
        </div>
        <div class="typing-bubble">
          <div class="typing-dots">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </div>
      </div>
    </div>
    
    <div class="chat-input">
      <div class="input-container">
        <input type="text" placeholder="Type your message...">
        <button class="send-btn" [ngStyle]="{'background-color': themeColor}">
          <i class="bi bi-send-fill"></i>
        </button>
      </div>
    </div>
  </div>
</div>
